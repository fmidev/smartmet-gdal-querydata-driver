version: 2.1
jobs:
  build-rhel8:
    docker:
      - image: fmidev/smartmet-cibase-8:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-rhel9:
    docker:
      - image: fmidev/smartmet-cibase-9:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-rhel10:
    docker:
      - image: quay.io/fmi/smartmet-cibase-10:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-ubuntu26:
    docker:
      - image: ubuntu:26.04
    resource_class: xlarge
    environment:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run:
          name: Install git and ca-certificates; trust working trees
          command: |
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates git openssh-client
            # Configure git's safe.directory *before* the checkout step.
            #
            # In cloud CircleCI this is a no-op — checkout's `git clone`
            # creates the working tree itself, so ownership matches the
            # container user.
            #
            # In `circleci local execute`, the host's working tree is
            # bind-mounted at /tmp/_circleci_local_build_repo and checkout
            # copies from there into ~/project. Git inside the container
            # is root but the mount keeps the host uid, so without
            # safe.directory git refuses with "dubious ownership in
            # repository at '/tmp/_circleci_local_build_repo'" and the
            # whole checkout silently fails (subsequent steps see an
            # empty ~/project and dpkg-buildpackage exits with
            # "cannot open file debian/changelog").
            #
            # safe.directory '*' allows every path — fine inside a
            # single-use CI container.
            git config --global --add safe.directory '*'
      - checkout
      - run:
          name: Install build dependencies
          command: |
            apt-get install -y --no-install-recommends \
              build-essential pkg-config dpkg-dev debhelper \
              libgdal-dev libgeos++-dev libproj-dev libfmt-dev libicu-dev \
              libdouble-conversion-dev \
              libboost-chrono-dev libboost-iostreams-dev libboost-regex-dev \
              libboost-serialization-dev libboost-thread-dev
      - run:
          name: Build .deb
          command: |
            # Mirror the RPM jobs' parallelism (RPM_BUILD_NCPUS=8). On Debian
            # the conventional knob is DEB_BUILD_OPTIONS=parallel=N — debhelper
            # reads it and passes -jN through to make. resource_class: xlarge
            # gives 8 vCPUs; `nproc` keeps it correct if the class ever changes.
            DEB_BUILD_OPTIONS=parallel=$(nproc) dpkg-buildpackage -us -uc -b
      - run:
          name: Collect .deb artefacts
          command: |
            mkdir -p /dist
            mv ../*.deb /dist/
            ls -l /dist/
      - persist_to_workspace:
          root: /dist
          paths: ./*.deb
workflows:
  version: 2.1
  build-test:
    jobs:
      - build-rhel8
      - build-rhel9
      - build-rhel10
      - build-ubuntu26
