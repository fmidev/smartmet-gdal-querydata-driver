version: 2.1
jobs:
  build-rhel8:
    docker:
      - image: fmidev/smartmet-cibase-8:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-rhel9:
    docker:
      - image: fmidev/smartmet-cibase-9:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-rhel10:
    docker:
      - image: quay.io/fmi/smartmet-cibase-10:latest
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: ci-build deps
      - run:
          name: Build RPM
          command: ci-build rpm
      - persist_to_workspace:
          root: /dist
          paths: ./*.rpm
  build-ubuntu26:
    docker:
      - image: ubuntu:26.04
    resource_class: xlarge
    environment:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run:
          name: Install git and ca-certificates so CircleCI can check out the repo
          command: |
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates git openssh-client
      - run:
          name: Stash mounted source if running under `circleci local execute`
          command: |
            # `circleci local execute` mounts the host working directory into
            # this container, so the project files are already here before
            # `checkout` runs. The built-in `checkout` step would otherwise
            # clobber them with origin's HEAD, losing any unpushed local work
            # (and breaking the .deb build if e.g. debian/changelog only
            # exists locally).  Detect the local-execute case by checking for
            # source files already in $PWD, and tar them aside so the
            # post-checkout step can restore them.  In a cloud CircleCI
            # build, $PWD is empty at this point and the check is a no-op.
            if [ -f Makefile ] && [ -d qd_driver ]; then
              mkdir -p /tmp/cci-local-stash
              tar -cf - . | tar -C /tmp/cci-local-stash -xf -
              echo "Stashed mounted source ($(du -sh /tmp/cci-local-stash | cut -f1))"
            fi
      - checkout
      - run:
          name: Restore stashed source over checkout (local-execute only)
          command: |
            if [ -d /tmp/cci-local-stash ]; then
              echo "Restoring local source on top of origin checkout"
              find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              tar -cf - -C /tmp/cci-local-stash . | tar -xf -
              rm -rf /tmp/cci-local-stash
            fi
      - run:
          name: Install build dependencies
          command: |
            apt-get install -y --no-install-recommends \
              build-essential pkg-config dpkg-dev debhelper \
              libgdal-dev libgeos++-dev libproj-dev libfmt-dev libicu-dev \
              libdouble-conversion-dev \
              libboost-chrono-dev libboost-iostreams-dev libboost-regex-dev \
              libboost-serialization-dev libboost-thread-dev
      - run:
          name: Build .deb
          command: |
            # CircleCI's checkout creates files owned by a different user than
            # dpkg-buildpackage runs as; without this, git refuses to operate
            # on the working tree ("dubious ownership") and the Makefile's
            # submodule init fails.
            git config --global --add safe.directory '*'
            dpkg-buildpackage -us -uc -b
      - run:
          name: Collect .deb artefacts
          command: |
            mkdir -p /dist
            mv ../*.deb /dist/
            ls -l /dist/
      - persist_to_workspace:
          root: /dist
          paths: ./*.deb
workflows:
  version: 2.1
  build-test:
    jobs:
      - build-rhel8
      - build-rhel9
      - build-rhel10
      - build-ubuntu26
